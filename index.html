<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kháng Chiến — Demo TikTok LIVE</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 24px;
    background: radial-gradient(circle at 50% 30%, #1f1a2e, #07060c 70%); font-family: system-ui, "Segoe UI", sans-serif; color: #f3e9ff;
  }
  .phone {
    width: 390px; height: 844px; background: #050409; border-radius: 36px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 9px #1c1830, 0 0 0 11px #3b2c5c, 0 24px 60px rgba(0,0,0,.7); display: flex; flex-direction: column;
  }
  .topbar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px 8px; z-index: 3; background: linear-gradient(#000a, #0000); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .host { display: flex; gap: 8px; align-items: center; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fbcfe8, #9d174d); border: 2px solid #f9a8d4; }
  .pill { background: #0008; border: 1px solid #ffffff1a; border-radius: 999px; padding: 3px 9px; font-size: 12px; }
  .live { background: linear-gradient(90deg,#ef4444,#f97316); color: #fff; border-radius: 6px; padding: 2px 7px; font-weight: 800; font-size: 11px; letter-spacing: .5px; }
  .rbtn { background: #1c1630cc; color: #fda4af; border: 1px solid #fb718555; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .rbtn:hover { background: #3b1230; }
  .stage { position: relative; height: 500px; flex: none; }
  canvas { width: 100%; height: 100%; display: block; }

  /* Thanh phe: mờ nhẹ để không che hiệu ứng phía sau */
  .hud { position: absolute; left: 10px; right: 10px; top: 48px; display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 800; z-index: 2; pointer-events: none; }
  .teamhud { width: 46%; padding: 4px 8px 5px; border-radius: 10px; background: #0006; border: 1px solid #ffffff14; backdrop-filter: blur(1px); }
  .teamhud.xanh { border-left: 4px solid #38bdf8; }
  .teamhud.do { border-right: 4px solid #f43f5e; text-align: right; }
  .teamhud .name { display: flex; justify-content: space-between; text-shadow: 0 1px 2px #000; font-size: 11px; }
  .teamhud.xanh .name b { color: #7dd3fc; } .teamhud.do .name b { color: #fda4af; }
  .hpbar { height: 7px; border-radius: 4px; background: #000a; border: 1px solid #ffffff22; margin-top: 3px; overflow: hidden; }
  .hpbar > div { height: 100%; transition: width .3s; }
  .heart { margin-top: 3px; font-size: 10px; color: #fecdd3; text-shadow: 0 1px 2px #000; font-weight: 700; }
  .heartbar { height: 3px; border-radius: 2px; background: #0008; margin-top: 2px; overflow: hidden; }
  .heartbar > div { height: 100%; width: 0; background: linear-gradient(90deg,#fb7185,#f472b6); transition: width .3s; }

  .toast { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg,#be185d,#a855f7); color: #fff; padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 12px; z-index: 4; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; box-shadow: 0 6px 20px #0008; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: .95; }

  /* Wheel appears in the phone's dark lower area, preserving the battle view. */
  .gacha { position: absolute; left: 50%; top: auto; bottom: 4px; width: min(360px, calc(100% - 16px)); max-height: 172px; overflow: hidden; transform: translate(-50%, 8px) scale(.98); z-index: 6; background: linear-gradient(155deg,rgba(26,16,43,.72),rgba(9,7,17,.70)); border: 1px solid #a855f788; border-radius: 12px; padding: 6px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s; box-shadow: 0 0 14px #a855f722; }
  .gacha.show { opacity: .78; transform: translate(-50%, 0) scale(1); }
  .gacha .gt { font-size: 10px; color: #e9d5ff; font-weight: 800; }
  .gacha .gr { font-size: 18px; line-height: 1.1; font-weight: 900; margin: 5px 0 2px; text-shadow: 0 0 14px currentColor; }
  .gacha .gs { font-size: 10px; font-weight: 800; letter-spacing: .3px; min-height: 14px; }
  .gacha .gacha-clock { display:flex; align-items:center; gap:7px; margin:7px 0 6px; color:#c4b5fd; font-size:9px; }
  .gacha .gacha-track { height:4px; flex:1; overflow:hidden; border-radius:9px; background:#ffffff18; }
  .gacha .gacha-track i { display:block; width:0; height:100%; background:linear-gradient(90deg,#38bdf8,#a78bfa,#fbbf24); }
  .gacha .gacha-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; max-height:92px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#a855f788 transparent; }
  .gacha .gacha-slot { min-width:0; min-height:30px; display:flex; align-items:center; justify-content:flex-start; gap:3px; padding:2px 3px; border:1px solid #ffffff14; border-radius:6px; background:#ffffff05; color:#e9d5ff; text-align:left; transition:background .08s,border-color .08s,transform .08s; }
  .gacha .gacha-avatar { width:20px; height:24px; flex:0 0 20px; display:grid; place-items:center; font-size:13px; }
  .gacha .gacha-avatar img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 1px 3px #000); }
  .gacha .gacha-copy { min-width:0; flex:1; }
  .gacha .gacha-slot b { display:block; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:8px; line-height:1.1; }
  .gacha .gacha-slot small { width:100%; margin-top:3px; display:flex; align-items:center; justify-content:flex-start; gap:4px; color:#a5b4fc; font-size:7px; line-height:1; white-space:nowrap; }
  .gacha .g-role { font-weight:800; }
  .gacha .g-role.melee { color:#fdba74; }
  .gacha .g-role.support { color:#86efac; }
  .gacha .g-role.tank { color:#93c5fd; }
  .gacha .g-role.ranged { color:#fcd34d; }
  .gacha .g-role.magic { color:#c4b5fd; }
  .gacha .gacha-slot.active { transform:scale(1.04); border-color:#fde047; background:#fbbf2428; color:#fff; box-shadow:0 0 12px #fbbf2477; z-index:1; }
  @media (max-height: 760px) { .gacha { max-height: 154px; } .gacha .gacha-grid { max-height:72px; } .gacha .gacha-slot { min-height:26px; } .gacha .gacha-avatar { width:18px; height:20px; flex-basis:18px; } }

  /* Khu dưới: bảng quà, bảng xếp hạng, nhật ký */
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: linear-gradient(#0d0a16, #06040b); border-top: 1px solid #3b2c5c; }
  .tabs { display: flex; gap: 6px; padding: 6px 8px 0; }
  .tab { flex: 1; padding: 5px 0; font-size: 11px; font-weight: 700; color: #a78bfa; background: #130d22; border: 1px solid #2a2140; border-bottom: 0; border-radius: 8px 8px 0 0; cursor: pointer; }
  .tab.on { color: #fff; background: #241a3f; border-color: #4c3a7a; }
  .pane { flex: 1; min-height: 0; padding: 6px 8px 8px; display: none; flex-direction: column; gap: 5px; background: #241a3f33; }
  .pane.on { display: flex; }

  .legend { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 10px; background: linear-gradient(90deg,#1c1030,#101a30); border: 1px solid #4c3a7a; flex-wrap: wrap; min-height: 66px; }
  .lg-gift { display: flex; align-items: center; gap: 6px; font-size: 22px; min-width: 112px; }
  .lg-gift b { font-size: 12px; display: block; } .lg-gift small { font-size: 10px; color: #c4b5fd; display: block; }
  .lg-arrow { font-size: 18px; color: #f9a8d4; }
  .lg-units { display: flex; gap: 6px; flex: 1; }
  .pv { flex: 1; display: flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 8px; font-size: 10px; line-height: 1.2; }
  .pv img { height: 40px; } .pv b { font-size: 10px; }
  .pv.xanh { background: #0c2a3d; border: 1px solid #38bdf8; color: #bae6fd; }
  .pv.do { background: #3a0f1c; border: 1px solid #f43f5e; color: #fecdd3; flex-direction: row-reverse; text-align: right; }
  .pv.do img { transform: scaleX(-1); }
  .lg-note { width: 100%; font-size: 9px; color: #9ca3af; margin-top: -2px; }

  .boards { display: flex; gap: 5px; }
  .win-analysis { margin-bottom:5px; padding:5px 6px; border:1px solid #39334a; border-radius:9px; background:#11121a; }
  .wr-head { display:flex; justify-content:space-between; gap:6px; align-items:center; margin-bottom:3px; font-size:9px; }
  .wr-head b { color:#f8fafc; letter-spacing:.3px; } .wr-head span { color:#a1a1aa; font-size:8px; }
  .wr-cols { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .wr-cols section > small { display:block; margin-bottom:2px; color:#a1a1aa; font-size:8px; }
  .wr-row { display:grid; grid-template-columns:34px 27px minmax(12px,1fr) 32px; align-items:center; gap:3px; min-height:12px; font-size:8px; }
  .wr-name { font-weight:900; } .wr-row.xanh .wr-name,.wr-row.xanh .wr-rate { color:#7dd3fc; } .wr-row.do .wr-name,.wr-row.do .wr-rate { color:#fda4af; }
  .wr-rate { text-align:right; font-weight:900; } .wr-track { height:4px; border-radius:9px; overflow:hidden; background:#272536; } .wr-track i { display:block; height:100%; border-radius:9px; }
  .wr-record { color:#9ca3af; text-align:right; white-space:nowrap; }
  .wr-current { margin-top:3px; color:#e5e7eb; font-size:8px; font-weight:700; }
  .wr-note { color:#9ca3af; font-size:8px; }
  .bd { flex: 1; background: #0e0a1acc; border: 1px solid #2a2140; border-radius: 8px; padding: 4px 6px; min-width: 0; }
  .bd h4 { margin: 0 0 2px; font-size: 10px; color: #fbcfe8; }
  .bd .r { display: flex; gap: 4px; font-size: 10px; align-items: center; line-height: 1.5; }
  .bd .n { color: #fde68a; width: 9px; } .bd .u { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; } .bd .v { color: #e2e8f0; }
  .bd .r.empty { color: #64748b; }
  .u.xanh { color: #7dd3fc; } .u.do { color: #fda4af; }
  .counts { font-size: 10px; color: #c4b5fd; padding: 0 2px; }

  .feed { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 3px; justify-content: flex-end; }
  .fi { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: #000a; border-left: 3px solid #475569; line-height: 1.3; animation: pop .25s ease-out; }
  .fi b.xanh { color: #7dd3fc; } .fi b.do { color: #fda4af; }
  .fi.xanh { border-left-color: #38bdf8; } .fi.do { border-left-color: #f43f5e; }
  .fi.gift { background: linear-gradient(90deg, #5b1a4a99, #3b1a6a66); }
  .fi.sys { color: #fde68a; border-left-color: #fde047; }
  .fi i { color: #94a3b8; font-style: normal; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .sim { display: flex; gap: 5px; flex-wrap: wrap; }
  .sim button { flex: 1; min-width: 70px; padding: 5px 3px; font-size: 10px; background: #1c1630; color: #e9ddff; border: 1px solid #3b2c5c; border-radius: 8px; cursor: pointer; }
  .sim button:hover { background: #2a2140; }
  .sim #simCommentXanh { background:#082e43; border-color:#0ea5e9; color:#bae6fd; }
  .sim #simCommentDo { background:#431622; border-color:#f43f5e; color:#fecdd3; }
  .faction-key { display:flex; justify-content:center; gap:10px; padding:4px 2px; color:#e5e7eb; font-size:8px; font-weight:800; }
  .faction-key .x { color:#7dd3fc; } .faction-key .d { color:#fda4af; }
  .faction-key i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; }
  .faction-key .x i { background:#38bdf8; } .faction-key .d i { background:#fb7185; }
  .gifts { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; align-content: start; padding-right: 2px; }
  .gift-btn { background:#15151d; border: 1px solid #55505f; color: #fff; border-radius: 10px; padding: 4px 3px; font-size: 10px; cursor: pointer; text-align: center; line-height: 1.2; }
  .gift-btn:hover { box-shadow: 0 0 10px #c084fc55; } .gift-btn:active { transform: scale(.95); }
  .gift-btn .ico { font-size: 16px; display: block; } .gift-btn .coin { color: #fde047; font-size: 9px; font-weight:800; }
  .gift-btn .unit { display:grid; gap:2px; margin-top:3px; }
  .gift-btn .faction-line { display:flex; align-items:center; gap:3px; min-width:0; padding:2px 3px; border-radius:4px; font-size:8px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .gift-btn .faction-line b { flex:0 0 auto; font-size:7px; letter-spacing:.2px; }
  .gift-btn .faction-line span { overflow:hidden; text-overflow:ellipsis; }
  .gift-btn .faction-line.xanh { background:#07324a; color:#bae6fd; border-left:2px solid #38bdf8; }
  .gift-btn .faction-line.do { background:#431824; color:#fecdd3; border-left:2px solid #fb7185; }
  .gift-btn.t3 { border-color: #a78bfa; } .gift-btn.t5 { border-color: #fb923c; } .gift-btn.t6 { border-color: #fde047; }
  .gift-btn.random { border-color:#c084fc; }
  .adminlink { position: fixed; right: 16px; top: 16px; color: #f0abfc; font-size: 13px; text-align: right; line-height: 1.8; }
</style>
</head>
<body>
<div class="adminlink"><a style="color:#f0abfc" href="control.html" target="_blank">Mở app điều khiển →</a><br><a style="color:#f0abfc" href="admin.html" target="_blank">Mở trang quản lý →</a></div>

<div class="phone">
  <div class="gacha" id="gacha"></div>
  <div class="topbar">
    <div class="host"><div class="avatar"></div><div><div style="font-weight:800">Kháng Chiến</div><div class="pill">👁 <span id="viewers">1,284</span></div></div></div>
    <div style="display:flex;gap:6px;align-items:center"><button class="rbtn" id="btnReset" title="Đặt lại trận và bảng xếp hạng">⟲ Reset</button><span class="live">LIVE</span> <span class="pill">❤ <span id="likes">0</span></span></div>
  </div>

  <div class="stage">
    <canvas id="field"></canvas>
    <div class="toast" id="toast"></div>
    <div class="hud">
      <div class="teamhud xanh">
        <div class="name"><b>DÂN VIỆT & THẦN THÚ</b><span id="baseXanhTxt">100</span></div>
        <div class="hpbar"><div id="baseXanh" style="width:100%;background:linear-gradient(90deg,#0ea5e9,#7dd3fc)"></div></div>
        <div class="heart" id="heartXanhTxt">❤ 0/100</div>
        <div class="heartbar"><div id="heartXanh"></div></div>
      </div>
      <div class="teamhud do">
        <div class="name"><span id="baseDoTxt">100</span><b>YÊU TINH</b></div>
        <div class="hpbar"><div id="baseDo" style="width:100%;background:linear-gradient(90deg,#fb7185,#e11d48);margin-left:auto"></div></div>
        <div class="heart" id="heartDoTxt">❤ 0/100</div>
        <div class="heartbar"><div id="heartDo" style="margin-left:auto"></div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="tabs"><div class="tab on" id="tabInfo">🏆 Bảng xếp hạng · Nhật ký</div><div class="tab" id="tabDemo">🎁 Quà demo</div></div>
    <div class="pane on" id="paneInfo">
      <div class="legend" id="legend"></div>
      <div class="win-analysis" id="winAnalysis"></div>
      <div class="boards" id="boards"></div>
      <div class="counts" id="counts"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="pane" id="paneDemo">
      <div class="sim">
        <button id="simCommentXanh">Bình luận "1" (Xanh)</button><button id="simCommentDo">Bình luận "2" (Quái)</button>
        <button id="simHearts">Thả 100 tim</button><button id="simDefault">Lính mặc định: TẮT</button><button id="simGacha">🎰 Quay may</button>
      </div>
      <div class="faction-key">❤ 100 tim theo phe người xem chọn bằng bình luận gần nhất: 1 = Xanh · 2 = Quái</div>
      <div class="faction-key"><span class="x"><i></i>XANH · THẦN THÚ</span><span class="d"><i></i>QUÁI · YÊU TINH</span></div>
      <div class="gifts" id="gifts"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="game.js"></script>
<script>
  // chuyển tab khu dưới
  for (const [tab, pane] of [['tabInfo', 'paneInfo'], ['tabDemo', 'paneDemo']]) {
    document.getElementById(tab).onclick = () => {
      for (const [t, p] of [['tabInfo', 'paneInfo'], ['tabDemo', 'paneDemo']]) {
        document.getElementById(t).classList.toggle('on', t === tab); document.getElementById(p).classList.toggle('on', p === pane);
      }
    };
  }
</script>
</body>
</html>
